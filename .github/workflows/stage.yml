name: CI

# 1
# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the master branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: "Image version"
        required: true
#2
env:
  REGISTRY: "gchr.io/piyushpriyadarshi"
  IMAGE_NAME: "doc247-components"

#3
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2

      - name: Build container image
        run: docker build -t $(echo $REGISTRY)/$(echo $IMAGE_NAME):$(echo $GITHUB_SHA) . --build-arg github_token=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

      - name: Log in to Github Container Registry with short-lived credentials
        run: docker login --username piyushpriyadarshi --password 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 ghcr.io
      - name: Push image to Github Container Registry
        run: docker push $(echo $REGISTRY)/$(echo $IMAGE_NAME):$(echo $GITHUB_SHA)
